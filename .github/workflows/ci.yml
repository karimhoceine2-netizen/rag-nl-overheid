name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  retrieval:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q
      - name: Check retrieval floors
        run: >-
          uv run --locked python -m evals.retrieval_eval
          --reviewed-only --thresholds evals/thresholds.json --out-dir logs/ci-retrieval
      - name: Upload retrieval reports
        if: ${{ !cancelled() && hashFiles('logs/ci-retrieval/retrieval.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrieval-reports
          path: logs/ci-retrieval/
          if-no-files-found: error

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No .env in CI: this also proves a clean clone starts with one command.
      - name: Start with docker compose
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test endpoints
        run: |
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/search \
            -H 'Content-Type: application/json' \
            -d '{"question":"Valt een bezoek aan de huisarts onder mijn eigen risico?","k":3}' \
            | python3 -c 'import json,sys; hits=json.load(sys.stdin); assert len(hits)==3, hits'
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8000/ask -H 'Content-Type: application/json' \
            -d '{"question":"test"}')
          test "$code" = 503
      # Measured numbers for the README and the Cloud Run memory setting.
      - name: Record image size and peak memory
        if: ${{ !cancelled() }}
        run: |
          size=$(docker image inspect rag-nl-overheid:local --format '{{.Size}}')
          peak=$(docker compose exec -T api cat /sys/fs/cgroup/memory.peak)
          {
            echo "### Container measurements"
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Image size | $((size / 1024 / 1024)) MiB |"
            echo "| Peak memory (startup + 1 search) | $((peak / 1024 / 1024)) MiB |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Show logs on failure
        if: ${{ failure() }}
        run: docker compose logs
