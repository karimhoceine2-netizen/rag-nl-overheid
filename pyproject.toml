[project]
name = "rag"
version = "0.1.0"
description = "Dutch-language RAG over government information, with a reproducible evaluation harness"
authors = [
    { name = "karimhoceine2-netizen", email = "karimhoceine2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "snowballstemmer>=3.1.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import sorting, B = bugbear, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes the top-level `evals` package importable from tests.
pythonpath = ["."]
